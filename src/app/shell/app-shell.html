<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar" [attr.aria-label]="moduleName">
    <div class="sidebar-header">
      @if (collapsed()) {
        <button type="button" class="logo logo--symbol" aria-label="Expand navigation" (click)="collapsed.set(false)">
          <img src="onetrust-symbol-white.svg" alt="" width="37" height="20" />
        </button>
      } @else {
        <a class="logo" routerLink="/" aria-label="OneTrust home">
          <img src="onetrust-logo-white.svg" alt="" width="146" height="20" />
        </a>
        <div class="header-actions">
          <button oc-icon-button variant="inverse" size="sm" label="Search">
            <oc-icon name="magnifying-glass" />
          </button>
          <button oc-icon-button variant="inverse" size="sm" label="Collapse navigation" [tooltip]="false" (click)="collapsed.set(true)">
            <oc-icon name="sidebar-left" />
          </button>
        </div>
      }
    </div>

    <p class="module-name" [title]="moduleName">{{ moduleName }}</p>

    <nav class="nav" [attr.aria-label]="moduleName">
      @for (item of nav(); track item.label) {
        @if (isGroup(item)) {
          <div class="group">
            <button
              type="button"
              class="row"
              [class.active]="groupActive(item) && !isOpen(item)"
              [attr.aria-expanded]="isOpen(item)"
              [attr.title]="collapsed() ? item.label : null"
              (click)="onGroupClick(item)"
            >
              <oc-icon class="row-icon" variant="outline" [name]="item.icon" />
              <span class="row-label">{{ item.label }}</span>
              <oc-icon class="caret" name="chevron-down" size="sm" [class.closed]="!isOpen(item)" />
            </button>
            @if (isOpen(item)) {
              <div class="group-items">
                @for (link of item.children; track link.href) {
                  <a class="row row--nested" [routerLink]="link.href" routerLinkActive="active" ariaCurrentWhenActive="page">
                    <span class="row-label">{{ link.label }}</span>
                  </a>
                }
              </div>
            }
          </div>
        } @else {
          <a
            class="row"
            [routerLink]="item.href"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [attr.title]="collapsed() ? item.label : null"
          >
            @if (item.icon) {
              <oc-icon class="row-icon" variant="outline" [name]="item.icon" />
            }
            <span class="row-label">{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="sidebar-foot">
      <button
        oc-switch
        id="demo-mode"
        [(checked)]="demoMode"
        aria-label="Demo mode"
        [attr.title]="collapsed() ? 'Demo mode: ' + (demoMode() ? 'on' : 'off') : null"
      ></button>
      <label for="demo-mode" class="row-label">Demo mode</label>
    </div>
  </aside>

  <div class="workspace">
    <header class="top-bar">
      <p class="tenant">Trust Intelligence Platform - SK</p>
      <!-- Ask Copilot, notifications and the org switcher are hidden in this prototype. -->
      <button oc-icon-button variant="tertiary" label="Settings">
        <oc-icon name="gear" />
      </button>
      <oc-avatar size="sm" [initials]="userInitials" [label]="'Account: ' + user" />
      <button oc-icon-button variant="tertiary" label="Help">
        <oc-icon name="question-circle" />
      </button>
    </header>

    <main class="main">
      <router-outlet />
    </main>
  </div>
</div>
