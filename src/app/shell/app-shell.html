<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      @if (collapsed()) {
        <button type="button" class="logo logo--symbol" aria-label="Expand navigation" (click)="collapsed.set(false)">
          <img src="onetrust-symbol-white.svg" alt="" width="30" height="16" />
        </button>
      } @else {
        <a class="logo" routerLink="/" aria-label="OneTrust home">
          <img src="onetrust-logo-white.svg" alt="" width="117" height="16" />
        </a>
        <div class="header-actions">
          <button oc-icon-button variant="inverse" size="sm" label="Search">
            <oc-icon name="magnifying-glass" variant="outline" />
          </button>
          <button oc-icon-button variant="inverse" size="sm" label="Collapse navigation" [tooltip]="false" (click)="collapsed.set(true)">
            <oc-icon name="sidebar-right" variant="outline" />
          </button>
        </div>
      }
    </div>

    <nav class="nav" aria-label="Main">
      <button type="button" class="row" [attr.title]="collapsed() ? 'New chat' : null" (click)="newChat()">
        <oc-icon class="row-icon" name="plus" variant="outline" />
        <span class="row-label">New chat</span>
      </button>
      @for (item of nav; track item.href) {
        <a
          class="row"
          [routerLink]="item.href"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [attr.title]="collapsed() ? item.label : null"
        >
          <oc-icon class="row-icon" [name]="item.icon" variant="outline" />
          <span class="row-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (!collapsed()) {
      <section class="chats" aria-labelledby="chats-title">
        <button
          type="button"
          class="chats-head"
          [attr.aria-expanded]="chatsOpen()"
          aria-controls="chat-list"
          (click)="chatsOpen.set(!chatsOpen())"
        >
          <span id="chats-title">Chats</span>
          <oc-icon class="caret" name="chevron-up" variant="outline" [class.closed]="!chatsOpen()" />
        </button>
        @if (chatsOpen()) {
          <ul class="chat-list" id="chat-list">
            @for (c of chats(); track c.id) {
              <li>
                <button
                  type="button"
                  class="chat"
                  [class.active]="c.id === activeChat()"
                  [attr.aria-current]="c.id === activeChat() ? 'page' : null"
                  [title]="c.name"
                  (click)="openChat(c)"
                >
                  <span class="dot" aria-hidden="true"></span>
                  <span class="chat-name">{{ c.name }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </section>
    }

    <div class="sidebar-foot">
      <button
        type="button"
        class="user"
        [attr.aria-label]="'Account: ' + user + ', ' + userRole"
        [ocMenuTrigger]="userMenu"
        placement="top-start"
        [offset]="4"
      >
        <oc-avatar class="user-avatar" [initials]="userInitials" [label]="user" [showTooltip]="false" />
        <span class="user-text">
          <span class="user-name">{{ user }}</span>
          <span class="user-sub">{{ userRole }}</span>
          <span class="user-sub">{{ userTenant }}</span>
        </span>
        <oc-icon class="user-caret" name="angles-up-down" variant="outline" />
      </button>

      <!-- User Menu (Figma node 2260:769): opens upward from the top edge of the account button. -->
      <ng-template #userMenu>
        <oc-menu class="user-menu" [attr.aria-label]="'Account menu for ' + user">
          <div class="menu-profile">
            <oc-avatar class="user-avatar" [initials]="userInitials" [label]="user" [showTooltip]="false" />
            <span class="menu-text">
              <span class="menu-title">{{ user }}</span>
              <span class="menu-sub">{{ userRole }}</span>
              <span class="menu-sub">{{ userEmail }}</span>
            </span>
          </div>
          <oc-menu-separator />
          <div class="menu-entity">
            <span class="entity-mark" aria-hidden="true">{{ entity.name[0] }}</span>
            <span class="menu-text">
              <span class="menu-title">{{ entity.name }}</span>
              <span class="menu-sub">{{ entity.detail }}</span>
            </span>
            <oc-badge>{{ entity.plan }}</oc-badge>
          </div>
          <oc-menu-separator />
          <!-- Customize view and Sign out have no destination in this prototype. -->
          <button oc-menu-item>
            <span class="menu-label">Customize view...</span>
            <kbd class="menu-shortcut" aria-label="Command period">&#8984;.</kbd>
          </button>
          <button oc-menu-item (click)="openSettings()">Settings</button>
          <oc-menu-separator />
          <button oc-menu-item variant="destructive">Sign out</button>
        </oc-menu>
      </ng-template>
    </div>
  </aside>

  <div class="workspace">
    <main class="main">
      <router-outlet />
    </main>
  </div>
</div>
